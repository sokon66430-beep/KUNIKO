name: Build Sunmi Printer APK

# Builds the Sunmi companion app (sunmi-app/) into an installable APK in the
# cloud, so no local Android toolchain is needed. Download the APK from the run's
# "Artifacts" section and install it on the Sunmi.

on:
  push:
    paths:
      - "sunmi-app/**"
      - ".github/workflows/sunmi-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: sunmi-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: stookii-printer-apk
          path: sunmi-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
