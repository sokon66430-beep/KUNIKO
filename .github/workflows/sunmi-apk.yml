name: Build Sunmi Printer APK

# Builds the Sunmi companion app (sunmi-app/) into an installable APK in the
# cloud, so no local Android toolchain is needed. The APK is published to a
# GitHub Release with a stable download link the store can open on the T3 and
# install directly (no login, no unzip):
#   https://github.com/sokon66430-beep/KUNIKO/releases/download/app-latest/stookii.apk

on:
  push:
    paths:
      - "sunmi-app/**"
      - ".github/workflows/sunmi-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: sunmi-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: stookii-printer-apk
          path: sunmi-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for release
        run: cp sunmi-app/app/build/outputs/apk/debug/app-debug.apk stookii.apk

      - name: Publish APK to a stable Release link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Stookii app (latest)
          body: "Latest Stookii companion app for the Sunmi T3. Open this page on the T3, download stookii.apk, and install it."
          files: stookii.apk
          make_latest: true
